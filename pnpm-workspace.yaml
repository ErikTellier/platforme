packages:
  - "apps/*"
  - "packages/*"

# Impose le catalogue : `pnpm add` y inscrit la version au lieu de
# l'ecrire dans le package.json de l'application.
catalogMode: strict

# Le champ `engines` devient CONTRAIGNANT : sans ca il est un commentaire, et
# une mauvaise version de Node installe sans broncher pour casser plus loin.
engineStrict: true

# ═══ CHAINE D'APPROVISIONNEMENT ═══
#
# Ecrits ICI meme quand ils valent deja le defaut de pnpm 11 : un defaut se
# deplace d'une version a l'autre sans prevenir, et ces deux lignes font la
# difference entre etre protege et croire l'etre.

# Un paquet publie il y a moins de 24 h ne s'installe pas. C'est la parade au
# scenario habituel : compte de mainteneur compromis, version malveillante
# publiee, retiree en quelques heures. On laisse simplement passer la fenetre.
minimumReleaseAge: 1440

# Refuse un paquet qui PERD ses preuves de confiance par rapport a ses versions
# anterieures — signal typique d'un compte de publication compromis.
# Defaut pnpm : off.
trustPolicy: no-downgrade

# EXCEPTION, examinee le 2026-08-28.
#
# La politique ci-dessus rejette chokidar@4.0.3 : « high-risk trust downgrade,
# possible package takeover ». Examen fait :
#
#   - DEV UNIQUEMENT. Chaine : @nestjs/cli -> @nestjs/schematics ->
#     @angular-devkit/core, ou chokidar est un pair OPTIONNEL. Rien de tout
#     cela n'est expedie en production.
#   - AUCUNE SORTIE PAR MISE A JOUR. 4.0.3 est la derniere 4.x publiee, et
#     @angular-devkit exige ^4.0.0 : la 5.0.0 est hors contrainte.
#
# Epinglee a la VERSION EXACTE, et non au nom du paquet : le jour ou une
# 4.0.4 parait, elle repasse par la politique au lieu d'heriter du blanc-seing.
trustPolicyExclude:
  - 'chokidar@4.0.3'

# ═══ LE CATALOGUE ═══
#
# C'EST ICI QUE LES VERSIONS SE DECLARENT, ET NULLE PART AILLEURS.
#
# Un package.json d'application n'ecrit plus que `catalog:` : il dit de QUOI il
# depend, jamais en QUELLE version. Sans ca, deux paquets du depot finissent par
# epingler deux versions du meme outil — le lint passe ici et rougit la-bas,
# pour une raison que personne ne cherche du bon cote.
#
# Une montee de version se fait donc en UN endroit, et se voit dans le diff.
catalog:
  # Nest
  "@nestjs/common": ^11.1.11
  "@nestjs/core": ^11.1.11
  "@nestjs/platform-express": ^11.1.11
  "@nestjs/cli": ^11.0.14
  "@nestjs/schematics": ^11.0.9

  # Execution
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  source-map-support: ^0.5.21

  # Compilation
  #
  # TypeScript est epingle EXACTEMENT, sans accent circonflexe : une version
  # mineure change ce que le verificateur accepte, donc un `^` ferait rougir la
  # compilation un matin sans qu'aucune ligne du depot n'ait bouge.
  #
  # Plafonne a 6 : le CLI Nest exige l'API programmatique du compilateur, que
  # TypeScript 7.0 n'expose plus — elle est annoncee pour la 7.1.
  typescript: 6.0.3
  ts-loader: ^9.5.4
  ts-node: ^10.9.2
  tsconfig-paths: ^4.2.0

  # Suit la version de Node du champ `engines`, pas la sienne.
  "@types/node": ^24.13.3

  # Lint et style
  eslint: ^10.9.1
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.68.0
  eslint-config-prettier: ^10.0.1
  eslint-plugin-prettier: ^5.2.2
  prettier: ^3.9.6
  globals: ^17.0.0

  # Banc d'essai
  #
  # Aucun transformeur a ajouter : Vitest 4 embarque Vite 8 / Rolldown, qui
  # emet emitDecoratorMetadata. La recette unplugin-swc datait d'esbuild.
  vitest: ^4.1.11

  # Outillage du depot
  turbo: ^2.10.12
  zod: ^4.4.3
  '@nestjs/config': ^4.0.4

  # Harnais de securite : hooks git, message de commit, recherche de secrets.
  #
  # Ces outils ne servent qu'a la RACINE. Ils sont dans le catalogue quand meme,
  # parce que catalogMode strict l'exige et qu'une version doit se lire au meme
  # endroit que les autres, pas dans un package.json isole.
  husky: ^9.1.7
  lint-staged: ^17.3.0
  '@commitlint/cli': ^21.2.2
  '@commitlint/config-conventional': ^21.2.2
  secretlint: ^13.0.5
  '@secretlint/secretlint-rule-preset-recommend': ^13.0.5

# Dependance transitive du CLI Nest et de ts-node, jamais utilisee ici : on
# compile avec tsc, pas avec le constructeur SWC. Refus explicite plutot qu'un
# avertissement qui se repete a chaque installation.
allowBuilds:
  '@swc/core': false
